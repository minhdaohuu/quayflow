[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/minhdaohuu/quayflow"
rust-version = "1.98"

[workspace.dependencies]
qf-model = { path = "crates/qf-model" }
qf-policy = { path = "crates/qf-policy" }
qf-vault = { path = "crates/qf-vault" }
qf-adapter = { path = "crates/qf-adapter" }
qf-provider = { path = "crates/qf-provider" }
qf-engine = { path = "crates/qf-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
ureq = { version = "2.10", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
tiny_http = "0.12"
getrandom = "0.2"
memchr = "2"
junction = "1"
winreg = "0.52"
tempfile = "3"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_Storage_FileSystem",
] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = false
panic = "abort"
incremental = false
