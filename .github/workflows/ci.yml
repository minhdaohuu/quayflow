# CI: Rust workspace, Mod, installers and scripts, on Windows, Linux and macOS.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        shell: pwsh
        run: |
          rustup toolchain install
          rustc -Vv
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
      - name: Build debug binaries for the smoke test
        run: cargo build --locked -p quayflow
      # Real quayflow.exe against a fake Claude environment: temporary
      # CLAUDE_CONFIG_DIR and QUAYFLOW_HOME, network off, no real logins.
      - name: Smoke test (fake environment)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/e2e/smoke-fake-env.ps1 -Exe target\debug\quayflow.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: CLI behavior test (fake environment)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/e2e/cli-fake-env.ps1 -Exe target\debug\quayflow.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Scripted usage over time from a loopback fake usage/profile API (tests/sim/fake_api.py).
      - name: Simulation test (fake usage API)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/e2e/sim-usage.ps1 -Exe target\debug\quayflow.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux:
    name: Linux (clippy, test, smoke, installer, Mod)
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc -Vv
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
      - name: Build the program for the smoke test
        run: cargo build --locked -p quayflow
      - name: ShellCheck
        run: shellcheck -S warning installer/install.sh installer/test-install.sh tests/e2e/smoke-unix.sh
      # Under both shells users run it with: dash (/bin/sh on Debian, Ubuntu) and bash.
      - name: Installer sandbox test (install.sh, dash and bash)
        run: |
          QF_SH=dash sh installer/test-install.sh
          QF_SH=bash bash installer/test-install.sh
      # The real program against a fake environment: install.sh from a local release folder,
      # engine start and stop, quayflow update handing off to install.sh, uninstall.
      - name: Linux smoke test (fake environment)
        run: sh tests/e2e/smoke-unix.sh target/debug/quayflow
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Mod tests on Linux (claude plugin test)
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.319
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-empty"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          claude plugin test mod/quayflow

  macos:
    name: macOS (clippy, test, smoke, installer, Mod)
    runs-on: macos-15
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add x86_64-apple-darwin
          rustc -Vv
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Unit tests only ever touch throwaway Keychain items (hashed names of temporary folders);
      # the Keychain round trip skips itself where the runner has no usable Keychain.
      - name: cargo test
        run: cargo test --workspace --locked
      - name: Build the program for the smoke test
        run: cargo build --locked -p quayflow
      - name: Build for Intel Macs (compile check)
        run: cargo build --locked -p quayflow --target x86_64-apple-darwin
      - name: Installer sandbox test (install.sh)
        run: sh installer/test-install.sh
      - name: macOS smoke test (fake environment, Keychain off)
        run: sh tests/e2e/smoke-unix.sh target/debug/quayflow
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Mod tests on macOS (claude plugin test)
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.319
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-empty"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          claude plugin test mod/quayflow

  mod:
    name: Mod (marketplace, type check, validate, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      # Type check against Claude Code's host declarations in mod/host-types/.
      # That file is Claude Code's, so it is gitignored and not in the repo:
      # on CI this step normally skips with a warning (non-blocking). Run it
      # locally where the file exists. validate --strict and tests stay blocking.
      - name: Type-check the Mod
        shell: pwsh
        run: |
          if (-not (Get-ChildItem mod/host-types -Filter *.d.ts -ErrorAction SilentlyContinue)) {
            Write-Host '::warning::mod/host-types has no declaration file; TypeScript type check skipped.'
            exit 0
          }
          npx -y -p typescript@5.6.3 tsc -p mod/tsconfig.ci.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Installing Claude Code needs no sign-in. validate and test need none
      # either: the Mod's tests mock everything beneath the plugin.
      - name: Install Claude Code
        shell: pwsh
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.319
          claude --version
      - name: Validate the marketplace and the Mod (strict)
        shell: pwsh
        run: |
          claude plugin validate --strict .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          claude plugin validate --strict mod/quayflow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Mod tests (claude plugin test)
        shell: pwsh
        run: |
          # An empty config dir proves the tests need no signed-in Claude.
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'claude-empty'
          New-Item -ItemType Directory -Force $env:CLAUDE_CONFIG_DIR | Out-Null
          claude plugin test mod/quayflow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  powershell:
    name: PowerShell (analyzer, shell hook, installer sandbox)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Parse every script in PowerShell 7 and Windows PowerShell 5.1
        shell: pwsh
        run: |
          $check = {
            $bad = 0
            foreach ($f in Get-ChildItem -Path installer, shell -Include *.ps1, *.psm1 -Recurse) {
              $t = $null; $e = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e)
              if ($e.Count) { $bad++; Write-Host "::error file=$($f.FullName)::$($e[0].Message)" } else { Write-Host "$($f.Name) OK" }
            }
            exit $bad
          }
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($check.ToString()))
          foreach ($ps in 'pwsh', 'powershell.exe') {
            Write-Host "== $ps"
            & $ps -NoProfile -NonInteractive -EncodedCommand $encoded
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      # Owner-run scripts (real logins) never execute in CI; at least prove every script parses.
      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Include *.ps1, *.psm1 -Path installer, shell, tests | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "$($_.FullName):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -AcceptLicense
          # Write-Host is deliberate (installer UI; the prompt hook must not write
          # to the output stream). ShouldProcess does not fit internal helpers.
          $exclude = 'PSAvoidUsingWriteHost', 'PSUseShouldProcessForStateChangingFunctions', 'PSUseSingularNouns'
          $results = Get-ChildItem -Path installer, shell -Include *.ps1, *.psm1 -Recurse |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Warning, Error -ExcludeRule $exclude }
          $results | Format-Table ScriptName, Line, RuleName, Message -AutoSize -Wrap
          if ($results) { exit 1 }
      - name: Shell hook self-test (PowerShell 7 and 5.1)
        shell: pwsh
        run: ./shell/test-Quayflow.ps1
      - name: Installer sandbox test (PowerShell 7 and 5.1)
        shell: pwsh
        run: ./installer/test-install.ps1
