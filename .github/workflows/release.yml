# Release: reproducible build, hashes, build-provenance attestations, GitHub Release.
#
# Trigger: push a tag vX.Y.Z (the tag must equal the workspace version in
# Cargo.toml and, when present, mod/quayflow/.claude-plugin/plugin.json).
#
# Reproducibility: pinned toolchain (rust-toolchain.toml), Cargo.lock with
# --locked, SOURCE_DATE_EPOCH = tag commit time, path prefixes remapped,
# /Brepro for a deterministic PE header, release profile strips and disables
# incremental builds. The same commit is built twice in separate jobs and
# separate directories, for Windows, Linux and macOS; the release fails if the
# binaries differ. Linux builds on Ubuntu 22.04, so the program runs on
# distributions with glibc 2.35 and OpenSSL 3 or newer. macOS builds both
# Apple silicon and Intel programs on one runner; they carry the linker's
# ad-hoc signature only.
#
# Attestations: GitHub only issues artifact attestations for public
# repositories (or private ones on GitHub Enterprise Cloud). While this
# repository is private, the attest step is allowed to fail and the release
# notes say the assets are not attested; the installer then refuses them unless
# run with -SkipAttestation. Once public, every asset is attested and verified
# below with the same checks the installer makes (signer workflow, tag, commit).
#
# SOURCE_COMMIT (an asset, hashed and attested) records the tag's commit; the
# installer adds the Mod from the tag only while the tag still points there.
#
# Third-party actions are pinned to full commit SHAs (Dependabot updates them).

name: Release

on:
  push:
    tags: ['v*']
  # Dry run from main (Actions > Release > Run workflow): the same double builds and
  # comparisons, without publishing anything. Use it to test a change to this workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      epoch: ${{ steps.meta.outputs.epoch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: meta
        name: Check versions and read the commit time
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          $tag = $env:TAG
          if ($env:EVENT -eq 'workflow_dispatch') {
            # Dry run: the workspace version stands in for the tag; nothing is published.
            $cargo = Get-Content Cargo.toml -Raw
            if ($cargo -notmatch '(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"') { throw 'No [workspace.package] version in Cargo.toml' }
            $tag = "v$($Matches[1])"
            Write-Host "Dry run for $tag (nothing is published)"
          }
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') { throw "Tag $tag is not vX.Y.Z" }
          $version = $Matches[1]
          $cargo = Get-Content Cargo.toml -Raw
          if ($cargo -notmatch '(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"') { throw 'No [workspace.package] version in Cargo.toml' }
          if ($Matches[1] -ne $version) { throw "Cargo.toml version $($Matches[1]) does not match tag $tag" }
          $plugin = 'mod/quayflow/.claude-plugin/plugin.json'
          if (Test-Path $plugin) {
            $pv = (Get-Content $plugin -Raw | ConvertFrom-Json).version
            if ($pv -and $pv -ne $version) { throw "Mod version $pv does not match tag $tag" }
          }
          $epoch = (git log -1 --format=%ct $env:GITHUB_SHA).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          "epoch=$epoch" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version, SOURCE_DATE_EPOCH $epoch"

  build:
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - slot: a
            dir: src-a
          - slot: b
            dir: deeper/second/src-b
    env:
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: ${{ matrix.dir }}
      - name: Install the pinned toolchain (rust-toolchain.toml)
        shell: pwsh
        working-directory: ${{ matrix.dir }}
        run: |
          rustup toolchain install
          rustc -Vv
          cargo -V
      - name: Build (reproducible)
        shell: pwsh
        working-directory: ${{ matrix.dir }}
        run: |
          $src = (Get-Location).Path
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          # CARGO_ENCODED_RUSTFLAGS (0x1f-separated) keeps paths with spaces intact.
          $flags = @(
            "--remap-path-prefix=$src=.",
            "--remap-path-prefix=$cargoHome=/cargo",
            '-C', 'link-arg=/Brepro'
          )
          $env:CARGO_ENCODED_RUSTFLAGS = $flags -join [char]0x1f
          cargo build --release --locked -p quayflow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/quayflow.exe, target/release/quayflow-bg.exe out/
          Get-FileHash out/* -Algorithm SHA256 | Format-Table Hash, Path -AutoSize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-${{ matrix.slot }}
          path: ${{ matrix.dir }}/out/*.exe
          if-no-files-found: error
          retention-days: 7

  build-linux:
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - slot: a
            dir: src-a
          - slot: b
            dir: deeper/second/src-b
    env:
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: ${{ matrix.dir }}
      - name: Install the pinned toolchain (rust-toolchain.toml)
        working-directory: ${{ matrix.dir }}
        run: |
          rustup toolchain install
          rustc -Vv
      - name: Build (reproducible)
        working-directory: ${{ matrix.dir }}
        run: |
          src=$(pwd)
          cargo_home=${CARGO_HOME:-$HOME/.cargo}
          export RUSTFLAGS="--remap-path-prefix=$src=. --remap-path-prefix=$cargo_home=/cargo"
          cargo build --release --locked -p quayflow --bin quayflow
          mkdir -p out
          cp target/release/quayflow out/quayflow-linux-x86_64
          sha256sum out/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-linux-${{ matrix.slot }}
          path: ${{ matrix.dir }}/out/quayflow-linux-x86_64
          if-no-files-found: error
          retention-days: 7

  build-macos:
    needs: prepare
    runs-on: macos-15
    strategy:
      fail-fast: true
      matrix:
        include:
          - slot: a
            dir: src-a
          - slot: b
            dir: deeper/second/src-b
    env:
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: ${{ matrix.dir }}
      - name: Install the pinned toolchain (rust-toolchain.toml)
        working-directory: ${{ matrix.dir }}
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc -Vv
      - name: Build (reproducible; the linker's ad-hoc signature)
        working-directory: ${{ matrix.dir }}
        run: |
          src=$(pwd)
          cargo_home=${CARGO_HOME:-$HOME/.cargo}
          # -Wl,-S: no debug map at link time. The linker hashes the output into LC_UUID before
          # `strip` runs, and the debug map names object files by absolute path, so without it
          # two checkouts in different folders give different programs.
          export RUSTFLAGS="--remap-path-prefix=$src=. --remap-path-prefix=$cargo_home=/cargo -C link-arg=-Wl,-S"
          mkdir -p out
          for t in aarch64-apple-darwin:arm64 x86_64-apple-darwin:x86_64; do
            cargo build --release --locked -p quayflow --bin quayflow --target "${t%%:*}"
            cp "target/${t%%:*}/release/quayflow" "out/quayflow-macos-${t##*:}"
          done
          codesign -dv out/* 2>&1 | grep -E 'Signature|Identifier' || true
          shasum -a 256 out/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-macos-${{ matrix.slot }}
          path: ${{ matrix.dir }}/out/quayflow-macos-*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build, build-linux, build-macos]
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-a
          path: build-a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-b
          path: build-b
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-linux-a
          path: build-a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-linux-b
          path: build-b
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-macos-a
          path: build-a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-macos-b
          path: build-b
      - name: Compare the two builds
        shell: pwsh
        run: |
          $diff = 0
          foreach ($n in 'quayflow.exe', 'quayflow-bg.exe', 'quayflow-linux-x86_64', 'quayflow-macos-arm64', 'quayflow-macos-x86_64') {
            $a = (Get-FileHash "build-a/$n" -Algorithm SHA256).Hash
            $b = (Get-FileHash "build-b/$n" -Algorithm SHA256).Hash
            Write-Host "$n  a=$a  b=$b"
            if ($a -ne $b) { $diff++; Write-Host "::error::$n is not reproducible (two builds differ)" }
          }
          if ($diff) { exit 1 }
      - name: Assemble assets and SHA256SUMS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          Copy-Item build-a/quayflow.exe, build-a/quayflow-bg.exe, build-a/quayflow-linux-x86_64, build-a/quayflow-macos-arm64, build-a/quayflow-macos-x86_64 assets/
          Copy-Item installer/install.ps1, installer/install.sh, shell/Quayflow.psm1 assets/
          # The commit this release was built from. The installer adds the Mod from this
          # tag and refuses it unless the tag still points at this commit (tags can move).
          [IO.File]::WriteAllText((Join-Path (Resolve-Path assets) 'SOURCE_COMMIT'), "$env:GITHUB_SHA`n")
          $lines = Get-ChildItem assets -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          # sha256sum format, LF line endings, so `sha256sum -c SHA256SUMS` works too.
          [IO.File]::WriteAllText((Join-Path (Resolve-Path assets) 'SHA256SUMS'), (($lines -join "`n") + "`n"))
          Get-Content assets/SHA256SUMS
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        continue-on-error: ${{ github.event.repository.private }}
        with:
          subject-path: |
            assets/quayflow.exe
            assets/quayflow-bg.exe
            assets/quayflow-linux-x86_64
            assets/quayflow-macos-arm64
            assets/quayflow-macos-x86_64
            assets/install.ps1
            assets/install.sh
            assets/Quayflow.psm1
            assets/SOURCE_COMMIT
            assets/SHA256SUMS
      - name: Create the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTED: ${{ steps.attest.outcome }}
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          $sums = Get-Content assets/SHA256SUMS -Raw
          $attest = if ($env:ATTESTED -eq 'success') {
            "Every asset has a GitHub build-provenance attestation from this release workflow: ``gh attestation verify <file> --repo ${{ github.repository }} --signer-workflow ${{ github.repository }}/.github/workflows/release.yml --source-ref refs/tags/$tag``."
          } else {
            '**Not attested**: this repository is private, and GitHub issues artifact attestations only for public repositories. Verify the SHA-256 hashes; the installer refuses unattested files unless run with `-SkipAttestation`.'
          }
          $notes = @"
          Quayflow $tag for Windows (x64), Linux (x86_64) and macOS (Apple silicon and Intel).

          Install (per user, no administrator rights). Windows, in PowerShell:

          ``````powershell
          irm https://github.com/${{ github.repository }}/releases/download/$tag/install.ps1 | iex
          ``````

          Linux (glibc 2.35 and OpenSSL 3 or newer: Ubuntu 22.04, Debian 12, Fedora 36 and later) and macOS:

          ``````sh
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/$tag/install.sh | sh
          ``````

          Safer: download the installer, check it against SHA256SUMS below, read it, then run it. See docs/verify-release.md.

          Integrity: reproducible build (verified by two independent builds in this workflow), SHA-256 hashes below. Not Authenticode-signed; the macOS programs carry only the linker's ad-hoc signature (installed with curl, they are not quarantined). $attest Built from commit $($env:GITHUB_SHA) (also in ``SOURCE_COMMIT``); the installer adds the Mod only if the tag still points there.

          ``````text
          $sums``````

          Users are responsible for complying with their provider's terms and their organization's rules. Quayflow is not affiliated with or endorsed by Anthropic. MIT License.
          "@
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          $flags = @()
          if ($tag -match '-') { $flags += '--prerelease' }
          gh release create $tag (Get-ChildItem assets -File).FullName --title "Quayflow $tag" --notes-file notes.md --verify-tag @flags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  verify:
    needs: publish
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Download the published assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release download $env:TAG --repo $env:REPO --dir dl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dl
      - name: Check SHA256SUMS
        shell: pwsh
        run: |
          $bad = 0
          $expected = @('quayflow.exe', 'quayflow-bg.exe', 'quayflow-linux-x86_64', 'quayflow-macos-arm64', 'quayflow-macos-x86_64', 'install.ps1', 'install.sh', 'Quayflow.psm1', 'SOURCE_COMMIT')
          $seen = @()
          foreach ($line in Get-Content dl/SHA256SUMS) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { Write-Host "::error::Bad line: $line"; $bad++; continue }
            $name = $Matches[2]; $seen += $name
            $actual = (Get-FileHash "dl/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) { Write-Host "::error::$name hash mismatch"; $bad++ } else { Write-Host "$name OK" }
          }
          foreach ($n in $expected) { if ($seen -notcontains $n) { Write-Host "::error::$n missing from SHA256SUMS"; $bad++ } }
          $commit = (Get-Content dl/SOURCE_COMMIT -Raw).Trim()
          if ($commit -ne $env:GITHUB_SHA) { Write-Host "::error::SOURCE_COMMIT $commit is not the tag's commit $env:GITHUB_SHA"; $bad++ }
          if ($bad) { exit 1 }
      - name: Verify attestations
        if: ${{ !github.event.repository.private }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem dl -File) {
            # The same checks the installer makes: this repository's release workflow, this
            # tag, this commit.
            gh attestation verify $f.FullName --repo $env:REPO --signer-workflow "$env:REPO/.github/workflows/release.yml" --source-ref "refs/tags/$env:TAG" --source-digest $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::attestation failed for $($f.Name)"; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: Attestations skipped (private repository)
        if: ${{ github.event.repository.private }}
        shell: pwsh
        run: Write-Host '::warning::Repository is private; GitHub does not issue artifact attestations here, so none were verified.'
