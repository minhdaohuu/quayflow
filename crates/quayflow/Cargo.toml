[package]
name = "quayflow"
description = "Quayflow engine and command line: account groups, usage-aware switching and recovery for Claude Code"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "quayflow"

[[bin]]
name = "quayflow"
path = "src/main.rs"

[[bin]]
name = "quayflow-bg"
path = "src/bin/quayflow-bg.rs"

[dependencies]
qf-model.workspace = true
qf-adapter.workspace = true
qf-vault.workspace = true
qf-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
ureq.workspace = true
native-tls.workspace = true

[target.'cfg(windows)'.dependencies]
winreg.workspace = true

[build-dependencies]
winresource.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
